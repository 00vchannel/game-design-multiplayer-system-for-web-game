<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>多人連線檢查場</title></head><body><main><header><span>連線起始範本</span><h1>多人連線檢查場</h1></header><form id="connect-form"><label>暱稱<input id="name" maxlength="16" value="玩家" required></label><button id="connect" type="submit">開房</button></form><p id="status" role="status">尚未連線</p><p id="error" role="alert" hidden></p><section id="room" hidden><div class="toolbar"><span id="roster"></span><button id="start">開始</button><button id="leave">離開</button></div><label id="share-label" hidden>邀請連結<input id="share" readonly></label><button id="copy" hidden>複製邀請</button><canvas id="game" width="960" height="540" tabindex="0" aria-label="連線檢查場；方向鍵移動，空白鍵互動"></canvas><div class="toolbar"><span id="score"></span><span id="time"></span></div><div class="controls" aria-label="遊戲操作"><button data-x="-1" data-z="0" aria-label="向左">←</button><button data-x="0" data-z="-1" aria-label="向上">↑</button><button data-x="0" data-z="1" aria-label="向下">↓</button><button data-x="1" data-z="0" aria-label="向右">→</button><button id="action">互動</button></div><p class="hint">方向鍵／WASD 移動 · 空白鍵互動 · 共同互動六次後可重開局</p></section></main><script type="module" src="/src/main.js"></script></body></html>
